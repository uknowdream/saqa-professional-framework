name: Jira Nightly Reconciliation

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: jira-qa-sync
  cancel-in-progress: false

env:
  JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://dreamedx.atlassian.net' }}
  JIRA_EMAIL: ${{ vars.JIRA_EMAIL || 'teukusaiful7@gmail.com' }}
  JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'QA' }}
  SAQA_JIRA_FAIL_ON_UNAVAILABLE: ${{ vars.SAQA_JIRA_STRICT || 'false' }}
  GH_TOKEN: ${{ github.token }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  reconcile:
    name: Reconcile Jira with latest CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted reconciliation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify Jira secret
        run: |
          if [ -z "$JIRA_API_TOKEN" ]; then
            echo "ACTION REQUIRED: GitHub secret JIRA_API_TOKEN is missing or unavailable."
            exit 1
          fi
      - name: Install project
        run: python -m pip install -e .
      - name: Reconcile latest common main evidence
        run: python scripts/reconcile_jira.py
