name: SAQA Advanced QE

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: saqa-advanced-qe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advanced-qe:
    name: Advanced QE regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test,ci]'
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Advanced QE and lifecycle tests
        run: python -m pytest tests/test_advanced_qe.py tests/test_release_report.py tests/test_flaky.py tests/test_test_data.py tests/test_test_data_integration.py tests/test_history.py tests/test_observability_lifecycle.py tests/test_saqa_metrics_exporter.py --timeout=120
      - name: Contract negative/property regression
        run: python -m pytest tests/test_contract_gate.py tests/test_mock_contract_service.py tests/test_api_contract.py --timeout=120
      - name: Safe security regression against local Juice Shop
        run: |
          docker run --detach --rm --name saqa-advanced-security -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
          trap 'docker stop saqa-advanced-security >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              python scripts/safe_security_regression.py
              exit $?
            fi
            sleep 2
          done
          echo "Juice Shop did not become ready within 60 seconds"
          docker logs saqa-advanced-security || true
          exit 1
      - name: Restore previous quality history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          previous="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=success&per_page=100" --jq '[.workflow_runs[] | select(.name=="SAQA Advanced QE" and .head_sha!="${{ github.sha }}")] | first // empty')"
          previous_id="$(jq -r '.id // empty' <<< "$previous")"
          previous_sha="$(jq -r '.head_sha // empty' <<< "$previous")"
          if [ -n "$previous_id" ] && [ -n "$previous_sha" ]; then
            gh run download "$previous_id" -n "saqa-advanced-qe-$previous_sha" -D artifacts/previous || true
          fi
      - name: Generate release and observability evidence
        if: always()
        env:
          SAQA_MANIFEST: artifacts/evidence-manifest.json
          SAQA_RELEASE_REPORT: artifacts/release-certification.json
          SAQA_TESTED_SHA: ${{ github.sha }}
          SAQA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SAQA_EVIDENCE_DIR: artifacts/evidence
          SAQA_OBSERVABILITY_DIR: artifacts/observability
          SAQA_QE_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p artifacts/evidence artifacts/observability
          python - <<'PY'
          import json, os
          from pathlib import Path
          from saqa.evidence import EvidenceRecord, write_manifest, utc_now
          status = "PASS" if os.environ["SAQA_QE_STATUS"] == "success" else "FAIL"
          record = EvidenceRecord(
              "ADVANCED-QE", status, utc_now(), "saqa-framework",
              {"tested_sha": os.environ["SAQA_TESTED_SHA"], "source_sha": os.environ["SAQA_SOURCE_SHA"], "job_status": os.environ["SAQA_QE_STATUS"]},
          )
          Path("artifacts/evidence/advanced-qe.json").write_text(json.dumps(record.__dict__, sort_keys=True, indent=2)+"
", encoding="utf-8")
          write_manifest([record], Path("artifacts/evidence-manifest.json"))
          PY
          previous="$(find artifacts/previous -type f -name quality-history.jsonl -print -quit 2>/dev/null || true)"
          if [ -n "$previous" ]; then cp "$previous" artifacts/observability/quality-history.jsonl; fi
          SAQA_HISTORY_PATH=artifacts/observability/quality-history.jsonl python scripts/generate_qe_observability.py
          python scripts/generate_release_report.py
          release_status=$?
          python scripts/generate_commit_dashboard.py || true
          SAQA_EVIDENCE_DIR=artifacts/evidence SAQA_RELEASE_REPORT=artifacts/release-certification.json SAQA_FLAKY_REPORT=artifacts/observability/flaky-telemetry.json python -c 'from scripts.saqa_metrics_exporter import collect; print(collect())'
          exit $release_status
      - name: Attest immutable release evidence index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && job.status == 'success'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/observability/release-index-${{ github.sha }}.json
      - name: Upload advanced QE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saqa-advanced-qe-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
