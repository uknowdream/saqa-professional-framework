name: SAQA Contract Testing

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saqa-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contract-gate:
    name: OpenAPI contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[contract]'
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop-contract -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Diagnose Juice Shop readiness
        continue-on-error: true
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Juice Shop readiness probe did not succeed; the contract gate will classify the target as BLOCKED.'
          docker logs saqa-juice-shop-contract || true
      - name: Run contract gate
        env:
          SAQA_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/contract_gate.py
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-contract-evidence
          path: artifacts/targets/juice-shop-contract.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-contract || true
