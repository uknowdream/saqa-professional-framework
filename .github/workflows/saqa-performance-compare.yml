name: SAQA Compare Measured Performance Baselines

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: GitHub Actions run ID that contains the baseline candidate sample artifact
        required: true
        type: string
      baseline_artifact_name:
        description: Exact artifact name containing measured-run-set.json and raw-runs/ (from a reviewed run)
        required: true
        type: string
      candidate_run_id:
        description: GitHub Actions run ID that contains the candidate sample artifact
        required: true
        type: string
      candidate_artifact_name:
        description: Exact artifact name containing measured-run-set.json and raw-runs/
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compare:
    name: Verify provenance and compare repeated runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify selected runs are successful measured-sample workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Baseline run ID must be numeric" >&2; exit 2; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Candidate run ID must be numeric" >&2; exit 2; }
          python - <<'PY'
          import json, os, subprocess
          from scripts.performance_run_provenance import validate_sample_run

          repo = os.environ["GITHUB_REPOSITORY"]
          for label, run_key, artifact_key in (
              ("baseline", "BASELINE_RUN_ID", "BASELINE_ARTIFACT_NAME"),
              ("candidate", "CANDIDATE_RUN_ID", "CANDIDATE_ARTIFACT_NAME"),
          ):
              run_id = os.environ[run_key]
              raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/actions/runs/{run_id}"],
                  text=True,
              )
              run = json.loads(raw)
              validated = validate_sample_run(
                  run,
                  expected_repo=repo,
                  requested_run_id=run_id,
                  artifact_name=os.environ[artifact_key],
              )
              print(f"{label} run {run_id}: verified {validated['head_branch']} / {validated['event']} / {validated['artifact_name']}")
          PY
      - name: Download baseline artifact from selected run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.baseline_artifact_name }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/baseline
      - name: Download candidate artifact from selected run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact_name }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/candidate
      - name: Validate artifacts and compare
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/baseline/measured-run-set.json
          test -s artifacts/candidate/measured-run-set.json
          test -d artifacts/baseline/raw-runs
          test -d artifacts/candidate/raw-runs
          mkdir -p artifacts/comparison
          set +e
          python scripts/compare_performance_baseline.py \
            --baseline artifacts/baseline/measured-run-set.json \
            --candidate artifacts/candidate/measured-run-set.json \
            --baseline-source-root artifacts/baseline/raw-runs \
            --candidate-source-root artifacts/candidate/raw-runs \
            --policy performance/baselines/juice-shop-local-v1.json \
            --workload-script performance/k6/juice-shop.js \
            > artifacts/comparison/result.json
          result_code=$?
          set -e
          cat artifacts/comparison/result.json
          echo "comparison_exit_code=$result_code" >> "$GITHUB_OUTPUT"
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saqa-performance-comparison-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/comparison/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce comparison result
        if: always() && steps.compare.outcome == 'success'
        run: test "${{ steps.compare.outputs.comparison_exit_code }}" = "0"
