name: SAQA Mobile Readiness

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  juice-shop-mobile:
    name: Juice Shop Mobile Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Install Playwright
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop-mobile -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs saqa-juice-shop-mobile
          exit 1
      - name: Run read-only mobile readiness
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python scripts/juice_shop_mobile_readiness.py
      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: juice-shop-mobile-${{ matrix.browser }}
          path: artifacts/targets/juice-shop-mobile-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-mobile || true

  mobile-evidence-aggregation:
    name: Mobile canonical evidence aggregation
    runs-on: ubuntu-latest
    needs: [juice-shop-mobile]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Download mobile evidence
        uses: actions/download-artifact@v6
        with:
          pattern: juice-shop-mobile-*
          path: artifacts/mobile-executions
          merge-multiple: true
      - name: Aggregate and verify mobile manifest
        run: python -c "from pathlib import Path; from saqa.result_aggregation import aggregate; print('mobile evidence manifest SHA-256:', aggregate(Path('artifacts/mobile-executions'), Path('artifacts/mobile-evidence-manifest.json')))"
      - name: Upload mobile canonical evidence
        uses: actions/upload-artifact@v6
        with:
          name: saqa-mobile-canonical-evidence
          path: artifacts/mobile-evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
