name: SAQA Release Certification

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: saqa-release-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    name: Release certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Collect mandatory workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SAQA_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for attempt in {1..60}; do
            gh run list --repo "${GITHUB_REPOSITORY}" --commit "${SAQA_HEAD_SHA}" --limit 100               --json databaseId,name,status,conclusion,headSha,headBranch,event,url > artifacts/runs.json
            if python - <<'PY'
import json, os
required={"SAQA CI","SAQA Contract Testing","SAQA Accessibility","SAQA Mobile Readiness","SAQA k6 Performance"}
event=os.environ["GITHUB_EVENT_NAME"]
sha=os.environ["SAQA_HEAD_SHA"]
runs=json.load(open("artifacts/runs.json",encoding="utf-8"))
seen={r["name"] for r in runs if r.get("head_sha")==sha and r.get("head_branch")=="main" and r.get("event")==event and r.get("status")=="completed" and r.get("name") in required}
print(json.dumps({"required":sorted(required),"observed":sorted(seen),"event":event,"sha":sha},indent=2))
raise SystemExit(0 if required.issubset(seen) else 1)
PY
            then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then break; fi
            sleep 10
          done
      - name: Evaluate fail-closed certification
        env:
          SAQA_RUNS_JSON: artifacts/runs.json
          SAQA_HEAD_SHA: ${{ github.sha }}
          SAQA_REQUIRED_EVENT: ${{ github.event_name }}
        run: python scripts/qa_release_gate.py
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: saqa-release-certification
          path: artifacts/release-certification.json
          if-no-files-found: error
          retention-days: 14
