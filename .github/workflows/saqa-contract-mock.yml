name: SAQA Contract Mock Validation

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saqa-contract-mock-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mock-contract:
    name: Contract gate against deterministic mock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[contract,test]'

      - name: Start valid mock
        env:
          SAQA_MOCK_MODE: valid
          SAQA_MOCK_PORT: "3100"
        run: |
          python scripts/mock_contract_service.py > /tmp/saqa-mock-valid.log 2>&1 &
          echo $! > /tmp/saqa-mock-valid.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3100/ >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/saqa-mock-valid.log
          exit 1
      - name: Validate passing contract against mock
        env:
          SAQA_API_BASE_URL: http://127.0.0.1:3100
          SAQA_CONTRACT_OUTPUT: artifacts/targets/mock-contract-pass.json
        run: python scripts/contract_gate.py
      - name: Stop valid mock
        if: always()
        run: kill "$(cat /tmp/saqa-mock-valid.pid)" 2>/dev/null || true

      - name: Start invalid-schema mock
        env:
          SAQA_MOCK_MODE: invalid-schema
          SAQA_MOCK_PORT: "3101"
        run: |
          python scripts/mock_contract_service.py > /tmp/saqa-mock-invalid.log 2>&1 &
          echo $! > /tmp/saqa-mock-invalid.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3101/ >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/saqa-mock-invalid.log
          exit 1
      - name: Assert contract failure is fail-closed
        env:
          SAQA_API_BASE_URL: http://127.0.0.1:3101
          SAQA_CONTRACT_OUTPUT: artifacts/targets/mock-contract-fail.json
        run: |
          set +e
          python scripts/contract_gate.py
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("artifacts/targets/mock-contract-fail.json").read_text())
          assert evidence["status"] == "FAIL"
          PY
      - name: Stop invalid mock
        if: always()
        run: kill "$(cat /tmp/saqa-mock-invalid.pid)" 2>/dev/null || true

      - name: Upload mock evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saqa-contract-mock-evidence
          path: artifacts/targets/mock-contract-*.json
          if-no-files-found: error
          retention-days: 14
