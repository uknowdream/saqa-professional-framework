name: SAQA Accessibility

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: saqa-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SAQA_PLAYWRIGHT_VERSION: '1.62.0'
  SAQA_AXE_CORE_VERSION: '4.10.2'

jobs:
  accessibility-matrix:
    name: Juice Shop Accessibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: Verify Node and npm toolchain
        run: |
          node --version
          npm --version
      - name: Install project
        run: python -m pip install -e .
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install pinned axe-core oracle
        run: npm install --no-save --ignore-scripts "axe-core@${SAQA_AXE_CORE_VERSION}"
      - name: Verify axe-core version
        run: node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version !== process.env.SAQA_AXE_CORE_VERSION) process.exit(1); console.log('axe-core', p.version)"
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop-a11y -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs saqa-juice-shop-a11y
          exit 1
      - name: Run read-only accessibility gate
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
          SAQA_AXE_CORE_PATH: node_modules/axe-core/axe.min.js
        run: python scripts/juice_shop_accessibility_gate.py
      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: juice-shop-accessibility-${{ matrix.browser }}
          path: artifacts/targets/juice-shop-accessibility.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-a11y || true

  accessibility-canonical:
    name: Accessibility canonical evidence aggregation
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    needs: [accessibility-matrix]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Download accessibility evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: 'juice-shop-accessibility-*'
          path: artifacts/executions
          merge-multiple: false
      - name: Verify browser evidence set
        run: |
          count=$(find artifacts/executions -type f -name 'juice-shop-accessibility.json' | wc -l)
          test "$count" -eq 3 || { echo "expected 3 browser evidence files, found $count"; find artifacts/executions -type f -print; exit 1; }
      - name: Aggregate and verify accessibility manifest
        run: python -c "from pathlib import Path; from saqa.result_aggregation import aggregate; print('accessibility manifest SHA-256:', aggregate(Path('artifacts/executions'), Path('artifacts/accessibility-evidence-manifest.json')))"
      - name: Upload accessibility canonical evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-accessibility-canonical-evidence
          path: artifacts/accessibility-evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
