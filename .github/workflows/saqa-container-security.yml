name: SAQA Container Security
on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1' # Weekly pinned reference-image security scan
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saqa-container-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-reference-image:
    name: Scan pinned reference image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_VERSION: "0.76.0"
      TRIVY_IMAGE: "aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222"
      TRAINING_IMAGE: "bkimminich/juice-shop@sha256:8739101ade29358abb5469ee66ae78e582c97ed0a5543a4ad102e5fa5193526b"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve and record immutable target identity
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          printf '%s' "$TRAINING_IMAGE" > artifacts/security/training-image-ref.txt
          docker pull "$TRAINING_IMAGE"
          docker image inspect "$TRAINING_IMAGE" --format '{{index .RepoDigests 0}}' | grep -F "$TRAINING_IMAGE"
      - name: Generate pinned-image SPDX SBOM from registry
        run: |
          mkdir -p artifacts/security
          docker run --rm -v "$PWD/artifacts/security:/out" anchore/syft:v1.30.0 "registry:docker.io/$TRAINING_IMAGE" -o spdx-json=/out/juice-shop-sbom.spdx.json
      - name: Validate SBOM and record digest
        run: python scripts/validate_spdx_sbom.py --input artifacts/security/juice-shop-sbom.spdx.json --output artifacts/security/juice-shop-sbom-validation.json
      - name: Verify pinned Trivy runtime
        run: |
          mkdir -p artifacts/security
          docker run --rm "$TRIVY_IMAGE" --version | tee artifacts/security/trivy-version.txt
          grep -F "Version: ${TRIVY_VERSION}" artifacts/security/trivy-version.txt
      - name: Scan image for vulnerabilities, secrets, and misconfiguration
        run: |
          mkdir -p artifacts/security
          docker run --rm -v "$PWD/artifacts/security:/out" "$TRIVY_IMAGE" image --image-src remote --image-config-scanners misconfig,secret --scanners vuln,secret,misconfig --format json --output /out/juice-shop-trivy.json "$TRAINING_IMAGE"
      - name: Validate scanner report and summarize findings
        run: |
          python scripts/summarize_trivy_report.py --input artifacts/security/juice-shop-trivy.json --output artifacts/security/juice-shop-trivy-summary.json --image "$TRAINING_IMAGE" --scanner "trivy-${TRIVY_VERSION}"
      - name: Record expected findings for intentionally vulnerable training image
        run: |
          python scripts/evaluate_container_security_policy.py --summary artifacts/security/juice-shop-trivy-summary.json --policy security/container-security-policy.json --output artifacts/security/juice-shop-security-policy-result.json --report-only-expected-vulnerable-target
      - name: Build source-bound container security artifact manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXECUTION_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python scripts/build_container_security_manifest.py --artifact-dir artifacts/security --output artifacts/security/juice-shop-security-artifact-manifest.json --image "$TRAINING_IMAGE" --scanner-version "$TRIVY_VERSION" --source-sha "$SOURCE_SHA" --execution-sha "$EXECUTION_SHA" --event "$EVENT_NAME" --ref "$SOURCE_REF" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA"
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saqa-container-security-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30

  attest-reference-sbom:
    name: Attest trusted image SBOM provenance
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: scan-reference-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download validated container evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saqa-container-security-${{ github.sha }}
          path: artifacts/security
      - name: Attest SPDX image SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/security/juice-shop-sbom.spdx.json
      - name: Verify SPDX image SBOM provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/security/juice-shop-sbom.spdx.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/saqa-container-security.yml"
      - name: Attest source-bound container security manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/security/juice-shop-security-artifact-manifest.json
      - name: Verify security manifest provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/security/juice-shop-security-artifact-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/saqa-container-security.yml"
