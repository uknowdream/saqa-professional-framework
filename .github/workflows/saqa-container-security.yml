name: SAQA Container Security
on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1' # Weekly pinned reference-image security scan
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saqa-container-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-reference-image:
    name: Scan pinned reference image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIVY_VERSION: "0.76.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Pull pinned reference target
        run: docker pull bkimminich/juice-shop:v20.2.0
      - name: Generate pinned-image SPDX SBOM
        run: |
          mkdir -p artifacts/security
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/security:/out" anchore/syft:v1.30.0 bkimminich/juice-shop:v20.2.0 -o spdx-json=/out/juice-shop-sbom.spdx.json
      - name: Validate SBOM and record digest
        run: python scripts/validate_spdx_sbom.py --input artifacts/security/juice-shop-sbom.spdx.json --output artifacts/security/juice-shop-sbom-validation.json
      - name: Verify pinned Trivy runtime
        run: |
          mkdir -p artifacts/security
          docker run --rm "aquasec/trivy:${TRIVY_VERSION}" --version | tee artifacts/security/trivy-version.txt
          grep -F "Version: ${TRIVY_VERSION}" artifacts/security/trivy-version.txt
      - name: Scan image for vulnerabilities, secrets, and misconfiguration
        run: |
          mkdir -p artifacts/security
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/security:/out" aquasec/trivy:${TRIVY_VERSION} image             --scanners vuln,secret,misconfig             --format json             --output /out/juice-shop-trivy.json             bkimminich/juice-shop:v20.2.0
      - name: Validate scanner report and summarize findings
        run: |
          python scripts/summarize_trivy_report.py --input artifacts/security/juice-shop-trivy.json --output artifacts/security/juice-shop-trivy-summary.json --image bkimminich/juice-shop:v20.2.0 --scanner "trivy-${TRIVY_VERSION}"
      - name: Record expected findings for intentionally vulnerable training image
        run: |
          python scripts/evaluate_container_security_policy.py --summary artifacts/security/juice-shop-trivy-summary.json --policy security/container-security-policy.json --output artifacts/security/juice-shop-security-policy-result.json --report-only-expected-vulnerable-target
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-container-security-${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30
