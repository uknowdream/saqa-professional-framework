name: Jira Integration

on:
  push:
    branches: [main, 'saqa/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jira-cloud-readonly:
    name: Jira Cloud read-only verification
    runs-on: ubuntu-latest
    if: ${{ secrets.JIRA_API_TOKEN != '' }}
    timeout-minutes: 5
    env:
      JIRA_BASE_URL: https://dreamedx.atlassian.net
      JIRA_EMAIL: teukusaiful7@gmail.com
      JIRA_PROJECT_KEY: QA
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Verify Jira project access
        run: bash scripts/verify_jira_ci.sh
