name: SAQA Repeated Performance Sample Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Weekly measured sample set; never auto-promoted to a baseline

permissions:
  contents: read

concurrency:
  group: saqa-performance-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-repeated-samples:
    name: Collect five independent k6 samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAQA_K6_SCRIPT: performance/k6/juice-shop.js
      SAQA_K6_POLICY: performance/baselines/juice-shop-local-v1.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Start pinned Juice Shop target
        run: docker run --detach --rm --name saqa-juice-shop-samples -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for local target
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs saqa-juice-shop-samples
          exit 1
      - name: Collect five separate guarded runs
        id: collect
        run: |
          set -u
          mkdir -p artifacts/performance/raw-runs
          run_failed=0
          for run in 1 2 3 4 5; do
            export SAQA_K6_OUTPUT="artifacts/performance/raw-runs/run-${run}/gate-evidence.json"
            if python scripts/k6_gate.py; then
              echo "run ${run}: absolute guardrails PASS"
            else
              echo "run ${run}: absolute guardrails FAILED" >&2
              run_failed=1
            fi
            summary="artifacts/performance/raw-runs/run-${run}/k6-summary.json"
            if [ ! -s "$summary" ]; then
              echo "run ${run}: missing raw summary; refusing to fabricate a sample" >&2
              exit 2
            fi
          done
          fingerprint="runner-${ImageOS:-ubuntu-latest}-${ImageVersion:-unreported}-k6-1.2.0"
          python scripts/build_performance_run_set.py \
            --summary artifacts/performance/raw-runs/run-1/k6-summary.json \
            --summary artifacts/performance/raw-runs/run-2/k6-summary.json \
            --summary artifacts/performance/raw-runs/run-3/k6-summary.json \
            --summary artifacts/performance/raw-runs/run-4/k6-summary.json \
            --summary artifacts/performance/raw-runs/run-5/k6-summary.json \
            --policy performance/baselines/juice-shop-local-v1.json \
            --target-profile juice-shop-v20.2.0-local-loopback \
            --workload-profile products-search-v1 \
            --environment-fingerprint "$fingerprint" \
            --source-root artifacts/performance/raw-runs \
            --output artifacts/performance/measured-run-set.json
          echo "run_failed=$run_failed" >> "$GITHUB_OUTPUT"
      - name: Upload raw samples and run-set candidate
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-performance-samples-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce every sample's absolute guardrails
        if: always() && steps.collect.outcome == 'success'
        run: test "${{ steps.collect.outputs.run_failed }}" = "0"
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-samples || true
