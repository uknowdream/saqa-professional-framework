name: SAQA Release Certification

on:
  workflow_run:
    workflows:
      - SAQA CI
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit SHA to certify'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: saqa-certification-${{ github.event.workflow_run.head_sha || github.event.inputs.head_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Wait for mandatory domains
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Resolve commit
        id: check
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ github.event.inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          SAQA_RELEASE_MAX_AGE_HOURS: '6'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          REPORT_PATH="artifacts/release-readiness.json"
          jq -n '{schema:"saqa.release-readiness.v2",head_sha:null,required_branch:"main",ready:false,status:"UNVERIFIED",reason:"readiness evaluation did not complete"}' > "$REPORT_PATH"
          write_unverified_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              jq -n --arg reason "release readiness preflight failed with exit code $rc" '{schema:"saqa.release-readiness.v2",head_sha:null,required_branch:"main",ready:false,status:"UNVERIFIED",reason:$reason}' > "$REPORT_PATH" || true
            fi
          }
          trap write_unverified_on_error EXIT
          SHA="${EVENT_SHA:-$INPUT_SHA}"
          if [ -z "$SHA" ] || ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "A full lowercase commit SHA is required."; exit 2; fi
          CURRENT_MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          ready=true
          if [ "$SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Refusing certification for stale main commit $SHA; current main is $CURRENT_MAIN_SHA."
            ready=false
            runs='[]'
          else
            # SAQA CI is the single automatic trigger. Wait for every other mandatory
            # domain to finish so transiently incomplete evidence does not create
            # misleading or duplicate release-certification runs.
            MAX_ATTEMPTS=40
            for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
              CURRENT_MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
              if [ "$SHA" != "$CURRENT_MAIN_SHA" ]; then
                echo "Refusing certification because main moved to $CURRENT_MAIN_SHA while waiting for $SHA."
                ready=false
                runs='[]'
                break
              fi
              runs="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" --jq '.workflow_runs[]' | jq -s '.')"
              pending=0
              while IFS='|' read -r workflow workflow_path workflow_id; do
                run_status="$(jq -r --arg n "$workflow" --arg path "$workflow_path" --argjson wid "$workflow_id" --arg sha "$SHA" '([.[] | select(.name == $n and .path == $path and .workflow_id == $wid and .head_sha == $sha and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by([(.id // 0), (.run_attempt // 0)]) | if length == 0 then "MISSING" else .[-1].status end)' <<< "$runs")"
                if [ "$run_status" != "completed" ]; then pending=1; fi
              done <<'SAQA_WAIT_FOR_MANDATORY'
          SAQA CI|.github/workflows/saqa-ci.yml|345839221
          SAQA Contract Testing|.github/workflows/saqa-contract.yml|364893043
          SAQA Accessibility|.github/workflows/saqa-accessibility.yml|355591975
          SAQA Mobile Readiness|.github/workflows/saqa-mobile.yml|355328607
          SAQA k6 Performance|.github/workflows/saqa-k6.yml|364897799
          SAQA_WAIT_FOR_MANDATORY
              if [ "$pending" -eq 0 ]; then
                echo "All mandatory workflow runs reached completed status for main/$SHA."
                break
              fi
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Waiting for mandatory workflows to complete (attempt $attempt/$MAX_ATTEMPTS)."
                sleep 15
              fi
            done
            CURRENT_MAIN_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
            if [ "$SHA" != "$CURRENT_MAIN_SHA" ]; then
              ready=false
              runs='[]'
              echo "Refusing certification because main moved during readiness evaluation."
            fi
          fi
          MAX_AGE_HOURS="${SAQA_RELEASE_MAX_AGE_HOURS:-6}"
          if ! MAX_AGE_SECONDS="$(python -c 'import math,sys; v=float(sys.argv[1]); seconds=v*3600; valid=math.isfinite(v) and v > 0 and math.isfinite(seconds) and seconds >= 1 and seconds <= 86399999999999; print(int(seconds)) if valid else sys.exit(2)' "$MAX_AGE_HOURS" 2>/dev/null)"; then
            echo "SAQA_RELEASE_MAX_AGE_HOURS must be finite and positive."
            exit 2
          fi
          NOW_EPOCH="$(date -u +%s)"
          mkdir -p artifacts
          while IFS='|' read -r workflow workflow_path workflow_id required_artifact; do
            latest="$(jq --arg n "$workflow" --arg path "$workflow_path" --argjson wid "$workflow_id" --arg sha "$SHA" '([.[] | select(.name == $n and .path == $path and .workflow_id == $wid and .head_sha == $sha and .head_branch == "main" and (.event == "push" or .event == "workflow_dispatch")) | . + {__saqa_started: (.run_started_at | (try fromdateiso8601 catch 0))}] | sort_by([(.id // 0), (.run_attempt // 0)]) | if length == 0 then {} else .[-1] end)' <<< "$runs")"
            run_ok="$(jq --argjson now "$NOW_EPOCH" --argjson max_age "$MAX_AGE_SECONDS" 'if ((.id | type) == "number" and .id > 0 and (.run_attempt | type) == "number" and .run_attempt > 0 and .status == "completed" and .conclusion == "success" and .__saqa_started > 0 and ($now - .__saqa_started) >= 0 and ($now - .__saqa_started) <= $max_age) then 1 else 0 end' <<< "$latest")"
            if [ "$run_ok" -lt 1 ]; then
              ready=false
              echo "$workflow: no fresh successful evidence from expected workflow $workflow_path (ID $workflow_id) for main/$SHA"
              continue
            fi
            run_id="$(jq -r '.id' <<< "$latest")"
            started_epoch="$(jq -r '.__saqa_started' <<< "$latest")"
            if ! artifacts="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[]' | jq -s '.' 2>/dev/null)"; then
              ready=false
              echo "$workflow: GitHub failed to return artifact metadata for run $run_id; refusing certification"
              continue
            fi
            retention_floor_epoch=$((NOW_EPOCH + 72 * 3600))
            artifact_ok="$(jq --arg name "$required_artifact" --argjson started "$started_epoch" --argjson retention_floor "$retention_floor_epoch" '[.[] | select(.name == $name and .expired == false and (.size_in_bytes | type) == "number" and .size_in_bytes > 0 and (.created_at | (try fromdateiso8601 catch 0)) >= $started and (.expires_at | (try fromdateiso8601 catch 0)) > $retention_floor)] | length' <<< "$artifacts")"
            if [ "$artifact_ok" -lt 1 ]; then
              ready=false
              echo "$workflow: required artifact '$required_artifact' is missing, expired, empty, from an older attempt, or expires within 72 hours for run $run_id"
            else
              echo "$workflow: exact-workflow run and attempt-bound artifact '$required_artifact' verified for main/$SHA"
            fi
          done <<'SAQA_MANDATORY_WORKFLOWS'
          SAQA CI|.github/workflows/saqa-ci.yml|345839221|saqa-canonical-evidence
          SAQA Contract Testing|.github/workflows/saqa-contract.yml|364893043|saqa-contract-evidence
          SAQA Accessibility|.github/workflows/saqa-accessibility.yml|355591975|saqa-accessibility-canonical-evidence
          SAQA Mobile Readiness|.github/workflows/saqa-mobile.yml|355328607|saqa-mobile-canonical-evidence
          SAQA k6 Performance|.github/workflows/saqa-k6.yml|364897799|saqa-k6-evidence
          SAQA_MANDATORY_WORKFLOWS
          if [ "$ready" = true ]; then
            reason="All mandatory domains completed on main with fresh, exact-workflow evidence."
          else
            reason="One or more mandatory domains lack fresh exact-workflow evidence on main; certification is not available."
          fi
          CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg sha "$SHA" --arg status "${ready}" --arg reason "$reason" --arg checked_at "$CHECKED_AT" --argjson max_age_seconds "$MAX_AGE_SECONDS" '{schema:"saqa.release-readiness.v2",head_sha:$sha,required_branch:"main",checked_at:$checked_at,max_age_seconds:$max_age_seconds,ready:($status == "true"),status:(if $status == "true" then "READY" else "NOT_CERTIFIED" end),reason:$reason}' > artifacts/release-readiness.json
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Upload readiness decision
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-release-readiness-${{ steps.check.outputs.head_sha }}
          path: artifacts/release-readiness.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when the release is not ready
        if: steps.check.outputs.ready != 'true'
        run: |
          echo "::error title=Release not certified::Required workflow evidence is missing, pending, stale, invalid, or its artifacts are unavailable."
          echo "Inspect the uploaded saqa-release-readiness artifact for the exact missing domain(s)."
          exit 1

  certify:
    name: Evaluate release certification
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SAQA_HEAD_SHA: ${{ needs.readiness.outputs.head_sha }}
      SAQA_RELEASE_MAX_AGE_HOURS: '6'
    steps:
      - name: Checkout trusted certification code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
      - name: Collect exact-commit workflow evidence
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SAQA_HEAD_SHA}&per_page=100" --jq '.workflow_runs[]' | jq -s '.' > "$RUNNER_TEMP/saqa-runs.json"
      - name: Evaluate certification
        env:
          SAQA_RUNS_JSON: ${{ runner.temp }}/saqa-runs.json
        run: python scripts/qa_release_gate.py
      - name: Attest certified release decision provenance
        if: success()
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/release-certification.json
      - name: Independently verify release decision attestation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(jq -r '.status' artifacts/release-certification.json)" = "CERTIFIED"
          gh attestation verify artifacts/release-certification.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/qa-release-certification.yml"
      - name: Upload certification decision
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-release-certification-${{ needs.readiness.outputs.head_sha }}
          path: artifacts/release-certification.json
          if-no-files-found: error
          retention-days: 30
