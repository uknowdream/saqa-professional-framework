name: Framework Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Validate framework structure and safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f docs/GETTING_STARTED.md
          test -f SAQA-Professional-Framework-v1.1.zip
          grep -q "QA Automation" README.md
          grep -q "Playwright" README.md
          grep -q "API" README.md
          grep -q "Mobile" README.md
          echo "SAQA framework integrity check passed."

      - name: Validate framework scope and safety guardrails
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/validate_framework_scope.sh
          ./scripts/validate_framework_scope.sh

      - name: Validate GitHub Actions are immutable SHA-pinned
        shell: python
        run: |
          import pathlib
          import re

          uses_start = re.compile(r"^\s*uses:\s*")
          pinned_uses = re.compile(r"^\s*uses:\s*[^@\s]+@([0-9a-fA-F]{40})(?:\s+#.*)?\s*$")
          failures = []
          uses_count = 0
          for path in pathlib.Path(".github/workflows").glob("*.y*ml"):
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not uses_start.match(line):
                      continue
                  uses_count += 1
                  if not pinned_uses.fullmatch(line):
                      failures.append(f"{path}:{line_no}: {line.strip()}")
          if uses_count == 0:
              raise SystemExit("No GitHub Actions 'uses:' references found; integrity scan is invalid.")
          if failures:
              raise SystemExit("Unpinned or malformed GitHub Actions detected:\n" + "\n".join(failures))
          print(f"All {uses_count} GitHub Actions references are full 40-hex immutable commit SHAs.")
