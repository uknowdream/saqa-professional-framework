name: SAQA Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saqa-supply-chain-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sbom-and-vulnerability-policy:
    name: SBOM and vulnerability policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and pinned supply-chain tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pip-audit==2.9.0" "cyclonedx-bom==5.1.1"
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/security
          cyclonedx-py environment --output-format JSON --output-file artifacts/security/saqa-sbom.cdx.json
          python -m json.tool artifacts/security/saqa-sbom.cdx.json >/dev/null
      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit --format=json --output=artifacts/security/pip-audit.json
      - name: Evaluate severity policy and expiring exceptions
        if: always()
        run: |
          if [ ! -s artifacts/security/pip-audit.json ]; then
            echo '{"status":"FAIL","reason":"pip-audit did not produce a report"}' > artifacts/security/vulnerability-policy-result.json
            cat artifacts/security/vulnerability-policy-result.json
            exit 1
          fi
          python scripts/evaluate_vulnerability_policy.py \
            --audit-json artifacts/security/pip-audit.json \
            --policy-json security/vulnerability-policy.json \
            --output artifacts/security/vulnerability-policy-result.json
      - name: Upload SBOM and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-supply-chain-evidence-\${{ github.sha }}
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30
