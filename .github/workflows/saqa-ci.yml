name: SAQA CI

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # Weekly dependency, SBOM, and test compatibility review

permissions:
  contents: read

concurrency:
  group: saqa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SAQA_PLAYWRIGHT_VERSION: '1.62.0'

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test,ci]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests with retry-aware per-attempt telemetry
        shell: bash
        run: |
          mkdir -p artifacts/test-attempts
          set +e
          python -m pytest -p scripts.pytest_attempt_telemetry --reruns=1 --reruns-delay=1 -n auto --dist loadfile --timeout=120 --cov=saqa --cov-report=term-missing --junitxml=artifacts/junit.xml
          pytest_status=$?
          python scripts/summarize_test_attempts.py --input-dir artifacts/test-attempts --output artifacts/test-attempt-telemetry.json
          telemetry_status=$?
          set -e
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          exit "$telemetry_status"
      - name: Summarize test quality and quarantine policy
        if: always()
        run: |
          if [ ! -s artifacts/junit.xml ]; then
            echo "Missing JUnit XML; cannot report test quality."
            exit 2
          fi
          python scripts/test_quality_report.py --junit artifacts/junit.xml --policy quality/test-quarantine-policy.json --output artifacts/quality/test-quality-report.json
      - name: Generate and verify evidence
        run: python -m saqa.ci_evidence
      - name: Optimized-mode compile and import
        run: |
          python -O -m compileall -q src tests
          python -O -c "import saqa; from saqa import Evidence, ResultStatus; assert Evidence and ResultStatus"
      - name: Upload test and evidence artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-python-${{ matrix.python }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

  dependency-and-security:
    name: Dependency, SBOM, and secret hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and audit tooling
        run: |
          python -m pip install -e .
          python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0 bandit==1.8.6
          mkdir -p artifacts/security
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file artifacts/security/sbom.cdx.json
      - name: Dependency vulnerability audit
        id: dependency-audit
        continue-on-error: true
        run: pip-audit --format=json > artifacts/security/pip-audit.json
      - name: Validate audit output
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/security/pip-audit.json')
          if not path.is_file():
              raise SystemExit('pip-audit did not produce its JSON report')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, dict) or not isinstance(data.get('dependencies'), list):
              raise SystemExit('pip-audit JSON report must contain a dependencies list')
          vulnerable = sum(len(item.get('vulns', [])) for item in data['dependencies'] if isinstance(item, dict))
          print(f'Validated pip-audit report with {len(data["dependencies"])} dependencies and {vulnerable} vulnerability record(s).')
          PY
      - name: Attest SBOM provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/security/sbom.cdx.json
      - name: Verify SBOM artifact attestation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifacts/security/sbom.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: Static application security testing (Bandit)
        run: |
          bandit -r src scripts -lll -iii -f json -o artifacts/security/bandit-sast.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/security/bandit-sast.json").read_text(encoding="utf-8"))
          if not isinstance(report, dict) or not isinstance(report.get("results"), list):
              raise SystemExit("Bandit report schema invalid")
          high = [item for item in report["results"] if isinstance(item, dict)
                  and item.get("issue_severity") == "HIGH" and item.get("issue_confidence") == "HIGH"]
          print(f"Bandit validated {len(report['results'])} finding(s); {len(high)} high-severity/high-confidence finding(s).")
          PY
      - name: Secret pattern scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' . \
            --exclude-dir=.git --exclude='*.zip' --exclude='pip-audit.json' --exclude='sbom.cdx.json'
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-security-evidence
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce dependency audit
        if: steps.dependency-audit.outcome != 'success'
        run: |
          echo 'Dependency vulnerability audit failed; inspect the JSON artifact and remediate or review a documented exception.'
          exit 1

  database-quality:
    name: Isolated database quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run isolated database quality gate
        run: python scripts/database_quality_gate.py
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-database-quality
          path: artifacts/targets/database-quality.json
          if-no-files-found: error
          retention-days: 14

  target-policy:
    name: Target authorization policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Validate target policy
        run: python -m pytest tests/test_target_registry.py

  browser-matrix:
    name: Browser readiness (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install selected browser
        run: |
          # A blocked Microsoft apt feed on hosted runners can break Playwright's dependency install.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -l 'packages.microsoft.com' {} + | xargs -r sudo rm -f
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python -m saqa.browser_smoke

  juice-shop-e2e-matrix:
    name: Juice Shop E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install selected browser
        run: |
          # A blocked Microsoft apt feed on hosted runners can break Playwright's dependency install.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -l 'packages.microsoft.com' {} + | xargs -r sudo rm -f
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs saqa-juice-shop
          exit 1
      - name: Run real Juice Shop E2E
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python scripts/juice_shop_e2e.py
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: juice-shop-e2e-${{ matrix.browser }}
          path: artifacts/targets/juice-shop-e2e-${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop || true

  juice-shop-api-smoke:
    name: Juice Shop API quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop-api -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs saqa-juice-shop-api
          exit 1
      - name: Run read-only API smoke
        run: python scripts/juice_shop_api_smoke.py
      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: juice-shop-api-smoke
          path: artifacts/targets/juice-shop-api.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-api || true

  juice-shop-performance:
    name: Juice Shop Performance quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Start Juice Shop
        run: docker run --detach --rm --name saqa-juice-shop-performance -p 127.0.0.1:3000:3000 bkimminich/juice-shop:v20.2.0
      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs saqa-juice-shop-performance
          exit 1
      - name: Run read-only performance gate
        run: python scripts/juice_shop_performance_gate.py
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: juice-shop-performance
          path: artifacts/targets/juice-shop-performance.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop Juice Shop
        if: always()
        run: docker stop saqa-juice-shop-performance || true

  webgoat-e2e-matrix:
    name: WebGoat E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install selected browser
        run: |
          # A blocked Microsoft apt feed on hosted runners can break Playwright's dependency install.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -l 'packages.microsoft.com' {} + | xargs -r sudo rm -f
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start WebGoat
        run: docker run --detach --rm --name saqa-webgoat -p 127.0.0.1:8080:8080 webgoat/webgoat:v2026.4
      - name: Wait for WebGoat login page
        run: |
          for attempt in {1..45}; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 --max-redirs 0 http://127.0.0.1:8080/WebGoat/login 2>/dev/null || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then exit 0; fi
            sleep 2
          done
          docker logs saqa-webgoat
          exit 1
      - name: Run read-only WebGoat E2E
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python scripts/webgoat_e2e.py
      - name: Upload WebGoat evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: webgoat-e2e-${{ matrix.browser }}
          path: artifacts/targets/webgoat-e2e-${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop WebGoat
        if: always()
        run: docker stop saqa-webgoat || true

  evidence-aggregation:
    name: Canonical evidence aggregation
    runs-on: ubuntu-latest
    needs: [juice-shop-e2e-matrix, juice-shop-api-smoke, juice-shop-performance, webgoat-e2e-matrix, database-quality, docker-target-smoke]
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Download target evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: '*-e2e-*'
          path: artifacts/executions
          merge-multiple: true
      - name: Download API evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: juice-shop-api-smoke
          path: artifacts/executions
      - name: Download performance evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: juice-shop-performance
          path: artifacts/executions
      - name: Download database evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: saqa-database-quality
          path: artifacts/executions
      - name: Download Docker target smoke evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: saqa-docker-target-smoke
          path: artifacts/executions
      - name: Aggregate and verify canonical manifest
        run: python -c "from pathlib import Path; from saqa.result_aggregation import aggregate; print('evidence manifest SHA-256:', aggregate(Path('artifacts/executions'), Path('artifacts/evidence-manifest.json')))"
      - name: Upload canonical evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-canonical-evidence
          path: artifacts/evidence-manifest.json
          if-no-files-found: error
          retention-days: 14

  docker-target-smoke:
    name: Docker authorized target smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install Chromium
        run: |
          # A blocked Microsoft apt feed on hosted runners can break Playwright's dependency install.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -exec grep -l 'packages.microsoft.com' {} + | xargs -r sudo rm -f
          python -m playwright install --with-deps chromium
      - name: Validate Docker Compose definition
        run: docker compose -f docker-compose.qa-targets.yml config
      - name: Start and validate local OWASP targets
        run: bash scripts/qa_target_smoke.sh
      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: saqa-docker-target-smoke
          path: artifacts/targets/
          if-no-files-found: warn
          retention-days: 14
