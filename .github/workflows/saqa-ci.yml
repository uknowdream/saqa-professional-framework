name: SAQA CI

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m pytest --cov=saqa --cov-report=term-missing --junitxml=artifacts/junit.xml
      - name: Generate and verify evidence
        run: python -m saqa.ci_evidence
      - name: Optimized-mode compile and import
        run: |
          python -O -m compileall -q src tests
          python -O -c "import saqa; from saqa import Evidence, ResultStatus; assert Evidence and ResultStatus"
      - name: Upload test and evidence artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saqa-python-${{ matrix.python }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 14

  dependency-and-security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project and audit tooling
        run: |
          python -m pip install -e .
          python -m pip install pip-audit
      - name: Dependency audit
        run: pip-audit
      - name: Secret pattern scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' . \
            --exclude-dir=.git --exclude='*.zip'

  target-policy:
    name: Target authorization policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Validate target policy
        run: python -m pytest tests/test_target_registry.py

  browser-matrix:
    name: Browser readiness (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install Playwright
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python -m saqa.browser_smoke

  docker-target-smoke:
    name: Docker authorized target smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose definition
        run: docker compose -f docker-compose.qa-targets.yml config
      - name: Start and validate local OWASP targets
        run: bash scripts/qa_target_smoke.sh
      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saqa-docker-target-smoke
          path: artifacts/targets/
          if-no-files-found: warn
          retention-days: 14
