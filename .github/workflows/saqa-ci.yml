name: SAQA CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SAQA_PLAYWRIGHT_VERSION: 1.62.0

permissions:
  contents: read

jobs:
  # WebGoat readiness intentionally follows only its own local redirect chain;
  # the final response must be 2xx before E2E begins.
  webgoat-e2e:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install pinned Playwright
        run: python -m pip install "playwright==${SAQA_PLAYWRIGHT_VERSION}"
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start WebGoat
        run: docker run --detach --rm --name saqa-webgoat -p 127.0.0.1:8080:8080 webgoat/webgoat:2026
      - name: Wait for WebGoat
        run: |
          for attempt in {1..45}; do
            response="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{url_effective}' --max-time 5 --max-redirs 5 http://127.0.0.1:8080/WebGoat/ 2>/dev/null || true)"
            status="${response%% *}"
            final_url="${response#* }"
            if [[ "$status" =~ ^2[0-9][0-9]$ && "$final_url" == http://127.0.0.1:8080/WebGoat/* ]]; then exit 0; fi
            sleep 2
          done
          docker logs saqa-webgoat
          exit 1
      - name: Run read-only WebGoat E2E
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python scripts/webgoat_e2e.py
      - name: Upload WebGoat evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webgoat-e2e-${{ matrix.browser }}
          path: artifacts/targets/webgoat-e2e-${{ matrix.browser }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop WebGoat
        if: always()
        run: docker stop saqa-webgoat || true
