name: SAQA CI

on:
  push:
    branches: [main, 'saqa/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m pytest --cov=saqa --cov-report=term-missing
      - name: Optimized-mode tests
        run: python -O -m pytest

  dependency-and-security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project and audit tooling
        run: |
          python -m pip install -e .
          python -m pip install pip-audit
      - name: Dependency audit
        run: pip-audit
      - name: Secret pattern scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' . \
            --exclude-dir=.git --exclude='*.zip'

  target-policy:
    name: Target authorization policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Validate target policy
        run: python -m pytest tests/test_target_registry.py

  browser-matrix:
    name: Browser readiness (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Install Playwright
        run: python -m pip install 'playwright>=1.50,<2'
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke
        env:
          SAQA_BROWSER: ${{ matrix.browser }}
        run: python -m saqa.browser_smoke
