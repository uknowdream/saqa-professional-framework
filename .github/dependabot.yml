version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      python-runtime:
        patterns:
          - "httpx"
          - "hatchling"
      python-test-tooling:
        patterns:
          - "pytest*"
          - "coverage*"
          - "jsonschema"
          - "pytest-rerunfailures"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
