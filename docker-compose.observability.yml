services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/saqa.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - saqa-metrics

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  saqa-metrics:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["python", "scripts/saqa_metrics_exporter.py"]
    ports:
      - "127.0.0.1:9109:9109"
    volumes:
      - ./:/workspace:ro
