[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "saqa-professional-framework"
version = "2.1.0"
description = "Evidence-first, reproducible QA automation and certification framework"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8.2,<10", "pytest-cov>=6,<8", "jsonschema>=4.23,<5", "pytest-timeout>=2,<3", "pytest-rerunfailures==16.7"]
ci = ["pytest-xdist>=3,<4"]
contract = ["jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/saqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
